<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 310" width="840"><style>text{font-family:Inter, Arial, sans-serif;fill:#212121;font-size:15px}.b{font-weight:700}.s{font-size:13px}.c{text-anchor:middle}.p{fill:#ede7f6;stroke:#5e35b1;stroke-width:1.5}.o{fill:#fff3e0;stroke:#ff9100;stroke-width:1.5}.g{fill:#e8f5e9;stroke:#2e7d32;stroke-width:1.5}.r{fill:#ffebee;stroke:#c62828;stroke-width:1.5}.f{fill:#fff;stroke:#7e57c2;stroke-width:1.5}.z{fill:#f5f5f5;stroke:#9e9e9e;stroke-width:1.2;stroke-dasharray:5 4}.l{stroke:#7e57c2;stroke-width:2;fill:none}.d{stroke:#ff9100;stroke-width:2;fill:none;stroke-dasharray:6 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7e57c2"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9100"/></marker></defs>
<rect width="840" height="310" fill="#fff"/>
<rect class="p" x="20" y="20" width="360" height="200" rx="8"/>
<text class="b" x="40" y="50">Ansible</text>
<text class="s" x="110" y="50">hosti seadistus (control → server)</text>
<text class="s" x="40" y="85">• paigaldab Dockeri (roll docker)</text>
<text class="s" x="40" y="112">• kirjutab daemon.json-i, paneb paika CA</text>
<text class="s" x="40" y="139">• kopeerib compose.yaml-i</text>
<text class="s" x="40" y="166">• kirjutab .env-i saladustega Vaultist</text>
<text class="s" x="40" y="193">• käivitab docker_compose_v2</text>
<line class="l" x1="380" y1="120" x2="460" y2="120" marker-end="url(#a)"/>
<text class="c s" x="420" y="108">käivitab</text>
<rect class="o" x="460" y="20" width="360" height="200" rx="8"/>
<text class="b" x="480" y="50">Compose</text>
<text class="s" x="572" y="50">rakenduse teenused (serveris)</text>
<text class="s" x="480" y="85">• loob võrgud ja volume'id</text>
<text class="s" x="480" y="112">• tõmbab või ehitab image'id</text>
<text class="s" x="480" y="139">• käivitab konteinerid õiges järjekorras</text>
<text class="s" x="480" y="166">• ootab healthcheck'e</text>
<text class="s" x="480" y="193">• loob uuesti ainult muutunud teenused</text>
<line class="l" x1="640" y1="220" x2="640" y2="248" marker-end="url(#a)"/>
<rect class="f" x="460" y="250" width="67" height="40" rx="8"/><text class="b c" x="493.5" y="275.0">web01</text>
<rect class="f" x="533" y="250" width="67" height="40" rx="8"/><text class="b c" x="566.5" y="275.0">app01</text>
<rect class="f" x="606" y="250" width="67" height="40" rx="8"/><text class="b c" x="639.5" y="275.0">db01</text>
<rect class="f" x="679" y="250" width="67" height="40" rx="8"/><text class="b c" x="712.5" y="275.0">mc01</text>
<rect class="f" x="752" y="250" width="67" height="40" rx="8"/><text class="b c" x="785.5" y="275.0">rmq01</text>
