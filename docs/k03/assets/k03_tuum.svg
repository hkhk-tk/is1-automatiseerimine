<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 365" width="840"><style>text{font-family:Inter, Arial, sans-serif;fill:#212121;font-size:15px}.b{font-weight:700}.s{font-size:13px}.c{text-anchor:middle}.p{fill:#ede7f6;stroke:#5e35b1;stroke-width:1.5}.o{fill:#fff3e0;stroke:#ff9100;stroke-width:1.5}.g{fill:#e8f5e9;stroke:#2e7d32;stroke-width:1.5}.r{fill:#ffebee;stroke:#c62828;stroke-width:1.5}.f{fill:#fff;stroke:#7e57c2;stroke-width:1.5}.z{fill:#f5f5f5;stroke:#9e9e9e;stroke-width:1.2;stroke-dasharray:5 4}.l{stroke:#7e57c2;stroke-width:2;fill:none}.d{stroke:#ff9100;stroke-width:2;fill:none;stroke-dasharray:6 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7e57c2"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9100"/></marker></defs>
<rect width="840" height="365" fill="#fff"/>
<rect class="o" x="250" y="15" width="340" height="50" rx="8"/><text class="b c" x="420.0" y="37.0">konteineri protsess</text><text class="c s" x="420.0" y="55.0">näiteks nginx, PID 1 konteineris</text>
<line class="l" x1="420" y1="65" x2="420" y2="95" marker-end="url(#a)"/>
<rect class="p" x="20" y="95" width="800" height="200" rx="10"/>
<text class="b c s" x="420" y="282">Linuxi tuum (hostis üks, kõigile konteineritele ühine)</text>
<rect class="f" x="40" y="110" width="240" height="68" rx="8"/>
<text class="b c" x="160" y="132">namespace'id</text>
<text class="c s" x="160" y="152">mida protsess näeb: PID-id, võrk,</text>
<text class="c s" x="160" y="168">mount'id, hostinimi, kasutajad</text>
<rect class="f" x="300" y="110" width="240" height="68" rx="8"/>
<text class="b c" x="420" y="132">cgroup'id</text>
<text class="c s" x="420" y="152">kui palju tohib võtta:</text>
<text class="c s" x="420" y="168">mälu, CPU, protsesside arv</text>
<rect class="f" x="560" y="110" width="240" height="68" rx="8"/>
<text class="b c" x="680" y="132">juurfailisüsteem</text>
<text class="c s" x="680" y="152">pivot_root: protsess näeb</text>
<text class="c s" x="680" y="168">ainult image'i faile</text>
<rect class="f" x="40" y="190" width="240" height="68" rx="8"/>
<text class="b c" x="160" y="212">capability'd</text>
<text class="c s" x="160" y="232">millised root'i õigused</text>
<text class="c s" x="160" y="248">on lubatud</text>
<rect class="f" x="300" y="190" width="240" height="68" rx="8"/>
<text class="b c" x="420" y="212">seccomp</text>
<text class="c s" x="420" y="232">millised süsteemikutsed</text>
<text class="c s" x="420" y="248">on lubatud</text>
<rect class="f" x="560" y="190" width="240" height="68" rx="8"/>
<text class="b c" x="680" y="212">SELinux, AppArmor</text>
<text class="c s" x="680" y="232">milliseid faile ja</text>
<text class="c s" x="680" y="248">ressursse tohib puutuda</text>
<rect class="z" x="20" y="310" width="800" height="40" rx="8"/><text class="b c" x="420.0" y="335.0">riistvara: füüsiline server või VM</text>
</svg>
