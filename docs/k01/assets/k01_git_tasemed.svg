<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 250" width="840" height="250" font-family="Inter, Arial, sans-serif"><style>text{font-family:Inter, Arial, sans-serif;font-size:14px;fill:#212121}.b{font-weight:600;font-size:15px}.m{font-family:"JetBrains Mono",Consolas,monospace;font-size:14px}.p{fill:#5e35b1}.am{fill:#e65100}.box{fill:#ede7f6;stroke:#5e35b1;stroke-width:1.5}.acc{fill:#fff3e0;stroke:#ff9100;stroke-width:1.5}.ln{stroke:#7e57c2;stroke-width:1.8;fill:none}.la{stroke:#ff9100;stroke-width:1.8;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7e57c2"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9100"/></marker></defs><rect width="100%" height="100%" fill="#fff"/>
<rect x="10" y="60" width="190" height="70" rx="8" class="box"/><text x="105" y="90" text-anchor="middle" class="b">Töökaust</text><text x="105" y="113" text-anchor="middle">muudetud failid</text>
<line x1="105" y1="130" x2="105" y2="155" class="la" stroke-dasharray="4 3" marker-end="url(#b)"/>
<text x="105" y="186" text-anchor="middle" class="m">git restore fail</text><text x="105" y="212" text-anchor="middle">muudatus kaob</text>
<rect x="220" y="60" width="190" height="70" rx="8" class="box"/><text x="315" y="90" text-anchor="middle" class="b">Staging</text><text x="315" y="113" text-anchor="middle">pärast git add</text>
