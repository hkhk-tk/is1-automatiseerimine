<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" width="800" height="290" font-family="Inter, Arial, sans-serif" font-size="15" fill="#212121">
  <defs>
    <marker id="nool" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7e57c2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="290" fill="#ffffff"/>
  <text x="400" y="32" text-anchor="middle" font-size="14">Jenkinsfile kirjeldab etapid, Jenkins käivitab need järjest agendil</text>

  <rect x="20" y="60" width="130" height="90" rx="8" fill="#fff3e0" stroke="#ff9100" stroke-width="2"/>
  <text x="85" y="97" text-anchor="middle" font-weight="700">GitHub</text>
  <text x="85" y="123" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="13">commit a1b2c3d</text>

  <rect x="180" y="60" width="140" height="90" rx="8" fill="#5e35b1"/>
  <text x="250" y="97" text-anchor="middle" font-weight="700" fill="#ffffff">Jenkins</text>
  <text x="250" y="123" text-anchor="middle" font-size="13" fill="#ffffff">build ja testid</text>

  <rect x="350" y="60" width="130" height="90" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="415" y="97" text-anchor="middle" font-weight="700">SonarQube</text>
  <text x="415" y="123" text-anchor="middle" font-size="13">quality gate</text>

  <rect x="510" y="60" width="120" height="90" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="570" y="97" text-anchor="middle" font-weight="700">Nexus</text>
  <text x="570" y="123" text-anchor="middle" font-size="13">WAR versiooniga</text>

  <rect x="654" y="60" width="136" height="90" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="722" y="97" text-anchor="middle" font-weight="700">Docker image</text>
  <text x="722" y="123" text-anchor="middle" font-size="13">sama WAR</text>

  <line x1="150" y1="105" x2="176" y2="105" stroke="#7e57c2" stroke-width="2" marker-end="url(#nool)"/>
  <line x1="320" y1="105" x2="346" y2="105" stroke="#7e57c2" stroke-width="2" marker-end="url(#nool)"/>
  <line x1="480" y1="105" x2="506" y2="105" stroke="#7e57c2" stroke-width="2" marker-end="url(#nool)"/>
  <line x1="630" y1="105" x2="650" y2="105" stroke="#7e57c2" stroke-width="2" marker-end="url(#nool)"/>

  <g font-size="13" text-anchor="middle" fill="#424242">
    <text x="85" y="182">Mis muutus?</text>
    <text x="250" y="182">Kas kood</text>
    <text x="250" y="200">kompileerub ja</text>
    <text x="250" y="218">testid õnnestuvad?</text>
    <text x="415" y="182">Kas kood on</text>
    <text x="415" y="200">piisavalt hea?</text>
    <text x="570" y="182">Kus on fail ja</text>
    <text x="570" y="200">mis versioon see on?</text>
    <text x="722" y="182">Kas serverisse</text>
    <text x="722" y="200">läheb sama fail?</text>
  </g>
  <text x="400" y="266" text-anchor="middle" font-size="14">Kui etapp ebaõnnestub, jäävad järgmised etapid tegemata.</text>
</svg>
