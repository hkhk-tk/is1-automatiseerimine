<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="Inter, Arial, sans-serif" font-size="15" fill="#212121">
  <rect x="0" y="0" width="800" height="400" fill="#ffffff"/>
  <rect x="20" y="14" width="760" height="372" rx="10" fill="#fafafa" stroke="#5e35b1" stroke-width="2"/>
  <text x="40" y="40" font-weight="700" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#5e35b1">pipeline { }</text>
  <text x="200" y="40" font-size="13" fill="#424242">ülemised plokid kehtivad kogu pipeline'ile</text>

  <g font-size="13">
    <rect x="40" y="54" width="170" height="60" rx="8" fill="#ede7f6" stroke="#7e57c2"/>
    <text x="125" y="78" text-anchor="middle" font-weight="700" font-family="DejaVu Sans Mono, monospace">agent</text>
    <text x="125" y="99" text-anchor="middle">millisel masinal</text>
    <rect x="225" y="54" width="170" height="60" rx="8" fill="#ede7f6" stroke="#7e57c2"/>
    <text x="310" y="78" text-anchor="middle" font-weight="700" font-family="DejaVu Sans Mono, monospace">tools</text>
    <text x="310" y="99" text-anchor="middle">Maven ja Java</text>
    <rect x="410" y="54" width="170" height="60" rx="8" fill="#ede7f6" stroke="#7e57c2"/>
    <text x="495" y="78" text-anchor="middle" font-weight="700" font-family="DejaVu Sans Mono, monospace">environment</text>
    <text x="495" y="99" text-anchor="middle">muutujad</text>
    <rect x="595" y="54" width="165" height="60" rx="8" fill="#ede7f6" stroke="#7e57c2"/>
    <text x="677" y="78" text-anchor="middle" font-weight="700" font-family="DejaVu Sans Mono, monospace">triggers</text>
    <text x="677" y="99" text-anchor="middle">millal käivitub</text>
  </g>

  <rect x="40" y="130" width="720" height="168" rx="8" fill="#ffffff" stroke="#5e35b1" stroke-width="2"/>
  <text x="56" y="154" font-weight="700" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#5e35b1">stages { }</text>
  <text x="170" y="154" font-size="13" fill="#424242">etapid käivituvad järjest, ebaõnnestunud etapp peatab ülejäänud</text>
  <g font-family="DejaVu Sans Mono, monospace" font-size="13">
    <rect x="56" y="168" width="220" height="114" rx="8" fill="#ede7f6" stroke="#7e57c2"/>
    <text x="70" y="192" font-weight="700">stage('Build')</text>
    <text x="70" y="218">steps {</text>
    <text x="86" y="238">sh 'mvn package'</text>
    <text x="70" y="258">}</text>
    <rect x="290" y="168" width="220" height="114" rx="8" fill="#ede7f6" stroke="#7e57c2"/>
    <text x="304" y="192" font-weight="700">stage('Test')</text>
    <text x="304" y="218">steps {</text>
    <text x="320" y="238">sh 'mvn verify'</text>
    <text x="304" y="258">}  post { junit }</text>
    <rect x="524" y="168" width="220" height="114" rx="8" fill="#ffffff" stroke="#7e57c2" stroke-dasharray="6 4"/>
    <text x="538" y="192" font-weight="700">stage('SonarQube')</text>
    <text x="538" y="218" font-family="Inter, Arial, sans-serif">järgmised etapid</text>
    <text x="538" y="238" font-family="Inter, Arial, sans-serif">samal kujul</text>
  </g>

  <rect x="40" y="312" width="720" height="58" rx="8" fill="#fff3e0" stroke="#ff9100" stroke-width="2"/>
  <text x="56" y="336" font-weight="700" font-family="DejaVu Sans Mono, monospace" font-size="14">post { }</text>
  <text x="56" y="358" font-size="13">käivitub lõpus ka siis, kui build ebaõnnestus: testiraport, koristus, teavitus</text>
</svg>
