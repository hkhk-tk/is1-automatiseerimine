<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" font-family="Inter, Arial, sans-serif" font-size="15" fill="#212121">
  <defs>
    <marker id="nool" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7e57c2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="380" fill="#ffffff"/>

  <!-- Controller -->
  <rect x="230" y="20" width="550" height="140" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="250" y="46" font-weight="700" fill="#5e35b1">Controller · jenkins.lab</text>
  <rect x="250" y="64" width="180" height="76" rx="8" fill="#ffffff" stroke="#7e57c2"/>
  <text x="340" y="107" text-anchor="middle">Veebiliides</text>
  <line x1="430" y1="102" x2="470" y2="102" stroke="#7e57c2" stroke-width="2"/>
  <rect x="470" y="64" width="290" height="76" rx="8" fill="#ffffff" stroke="#7e57c2"/>
  <text x="615" y="94" text-anchor="middle" font-weight="700">$JENKINS_HOME</text>
  <text x="615" y="120" text-anchor="middle" font-size="13">jobid, credentialid, pluginad, logid</text>

  <!-- Agent -->
  <rect x="230" y="220" width="550" height="140" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="250" y="246" font-weight="700" fill="#5e35b1">Agent · sinu control node</text>
  <rect x="250" y="264" width="280" height="76" rx="8" fill="#ffffff" stroke="#7e57c2"/>
  <text x="390" y="294" text-anchor="middle" font-weight="700">Tööruum</text>
  <text x="390" y="320" text-anchor="middle" font-size="13">/opt/jenkins/workspace/…</text>
  <rect x="570" y="264" width="190" height="76" rx="8" fill="#fff3e0" stroke="#ff9100" stroke-width="2"/>
  <text x="665" y="294" text-anchor="middle" font-weight="700">labori-seis.war</text>
  <text x="665" y="320" text-anchor="middle" font-size="13">target/</text>
  <line x1="530" y1="302" x2="566" y2="302" stroke="#7e57c2" stroke-width="2" marker-end="url(#nool)"/>

  <!-- GitHub -->
  <rect x="20" y="250" width="150" height="64" rx="8" fill="#fff3e0" stroke="#ff9100" stroke-width="2"/>
  <text x="95" y="277" text-anchor="middle" font-weight="700">GitHub</text>
  <text x="95" y="299" text-anchor="middle" font-size="13">sinu repo</text>
  <line x1="170" y1="290" x2="246" y2="300" stroke="#7e57c2" stroke-width="2" marker-end="url(#nool)"/>
  <text x="208" y="281" text-anchor="middle" font-size="13">git clone</text>

  <!-- Controller -> agent -->
  <line x1="490" y1="140" x2="490" y2="260" stroke="#7e57c2" stroke-width="2" marker-end="url(#nool)"/>
  <text x="502" y="195" font-size="13">käsud (remoting)</text>

  <!-- WAR -> JENKINS_HOME -->
  <line x1="665" y1="264" x2="665" y2="144" stroke="#ff9100" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#nool)"/>
  <text x="677" y="195" font-size="13">archiveArtifacts</text>
</svg>
