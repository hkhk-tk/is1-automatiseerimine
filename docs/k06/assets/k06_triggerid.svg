<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="Inter, Arial, sans-serif" font-size="15" fill="#212121">
  <defs>
    <marker id="nool" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7e57c2"/>
    </marker>
    <marker id="noolA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff9100"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="400" fill="#ffffff"/>

  <rect x="30" y="20" width="350" height="56" rx="8" fill="#fff3e0" stroke="#ff9100" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="46" y="43" font-weight="700">GitHub webhook</text>
  <text x="46" y="65" font-size="13">GitHub saadab POST-i; VPN-i taga ei tööta</text>

  <rect x="30" y="96" width="350" height="56" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="46" y="119" font-weight="700">Poll SCM · meie valik</text>
  <text x="46" y="141" font-size="13">Jenkins küsib ise: kas on uus commit?</text>

  <rect x="30" y="172" width="350" height="56" rx="8" fill="#ede7f6" stroke="#7e57c2"/>
  <text x="46" y="195" font-weight="700">Build periodically</text>
  <text x="46" y="217" font-size="13">cron: ehitab kellaaja järgi, alati</text>

  <rect x="30" y="248" width="350" height="56" rx="8" fill="#ffffff" stroke="#7e57c2"/>
  <text x="46" y="271" font-weight="700">Remote trigger</text>
  <text x="46" y="293" font-size="13">curl POST …/build + API token</text>

  <rect x="30" y="324" width="350" height="56" rx="8" fill="#ffffff" stroke="#7e57c2"/>
  <text x="46" y="347" font-weight="700">Upstream</text>
  <text x="46" y="369" font-size="13">teine job lõpetas</text>

  <rect x="540" y="150" width="230" height="100" rx="8" fill="#5e35b1"/>
  <text x="655" y="194" text-anchor="middle" fill="#ffffff" font-weight="700">Job labori-seis</text>
  <text x="655" y="218" text-anchor="middle" fill="#ffffff" font-size="13">build käivitub</text>

  <line x1="380" y1="48" x2="536" y2="168" stroke="#ff9100" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#noolA)"/>
  <line x1="380" y1="124" x2="536" y2="186" stroke="#5e35b1" stroke-width="3" marker-end="url(#nool)"/>
  <line x1="380" y1="200" x2="536" y2="200" stroke="#7e57c2" stroke-width="2" marker-end="url(#nool)"/>
  <line x1="380" y1="276" x2="536" y2="214" stroke="#7e57c2" stroke-width="2" marker-end="url(#nool)"/>
  <line x1="380" y1="352" x2="536" y2="232" stroke="#7e57c2" stroke-width="2" marker-end="url(#nool)"/>
</svg>
