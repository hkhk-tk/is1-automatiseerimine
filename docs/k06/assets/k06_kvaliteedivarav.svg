<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" font-family="Inter, Arial, sans-serif" font-size="14" fill="#212121">
  <defs>
    <marker id="nool" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7e57c2"/>
    </marker>
    <marker id="noolA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff9100"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="460" fill="#ffffff"/>

  <!-- osalised -->
  <rect x="40" y="20" width="200" height="48" rx="8" fill="#5e35b1"/>
  <text x="140" y="50" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Jenkins (agent)</text>
  <rect x="320" y="20" width="200" height="48" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="420" y="50" text-anchor="middle" font-size="15" font-weight="700">SonarQube</text>
  <rect x="580" y="20" width="200" height="48" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="680" y="50" text-anchor="middle" font-size="15" font-weight="700">Compute Engine</text>

  <line x1="140" y1="68" x2="140" y2="350" stroke="#7e57c2" stroke-dasharray="4 4"/>
  <line x1="420" y1="68" x2="420" y2="350" stroke="#7e57c2" stroke-dasharray="4 4"/>
  <line x1="680" y1="68" x2="680" y2="350" stroke="#7e57c2" stroke-dasharray="4 4"/>

  <!-- 1 -->
  <line x1="140" y1="110" x2="416" y2="110" stroke="#7e57c2" stroke-width="2" marker-end="url(#nool)"/>
  <text x="280" y="100" text-anchor="middle">mvn sonar:sonar (raport + taskId)</text>
  <!-- 2 -->
  <line x1="420" y1="160" x2="676" y2="160" stroke="#7e57c2" stroke-width="2" marker-end="url(#nool)"/>
  <text x="550" y="150" text-anchor="middle">raport järjekorda</text>
  <!-- 3 ootamine -->
  <rect x="130" y="180" width="20" height="170" fill="#fff3e0" stroke="#ff9100"/>
  <text x="162" y="220">waitForQualityGate ootab</text>
  <!-- 4 analüüs -->
  <rect x="670" y="185" width="20" height="80" fill="#ede7f6" stroke="#5e35b1"/>
  <text x="660" y="230" text-anchor="end">analüüs ja quality gate'i tingimused</text>
  <!-- 5 webhook -->
  <line x1="670" y1="300" x2="154" y2="300" stroke="#ff9100" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#noolA)"/>
  <text x="412" y="290" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">webhook /sonarqube-webhook/ (OK või ERROR)</text>

  <!-- tulemus -->
  <rect x="40" y="366" width="300" height="36" rx="8" fill="#ede7f6" stroke="#5e35b1"/>
  <text x="56" y="389">OK → järgmine etapp (Nexus)</text>
  <rect x="40" y="412" width="300" height="36" rx="8" fill="#fff3e0" stroke="#ff9100"/>
  <text x="56" y="435">ERROR → abortPipeline, build FAILURE</text>
</svg>
