<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="nool" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7e57c2"/>
    </marker>
  </defs>
  <rect width="840" height="300" fill="#ffffff"/>
  <text x="18" y="30" font-size="16" font-weight="700" fill="#212121">Seitse kohtumist, üks rakendus</text>

  <!-- päevad: x = 18 + i*116, laius 108, keskpunkt x+54 -->
  <g font-size="14" fill="#212121" text-anchor="middle">
    <rect x="18" y="48" width="108" height="100" rx="8" fill="#ede7f6" stroke="#5e35b1"/>
    <text x="72" y="72" font-size="16" font-weight="700" fill="#5e35b1">K1</text>
    <text x="72" y="93">nädal 1</text>
    <text x="72" y="115" font-weight="700">Bash</text>
    <text x="72" y="134">+ Git</text>

    <rect x="134" y="48" width="108" height="100" rx="8" fill="#ede7f6" stroke="#5e35b1"/>
    <text x="188" y="72" font-size="16" font-weight="700" fill="#5e35b1">K2</text>
    <text x="188" y="93">nädal 2</text>
    <text x="188" y="115" font-weight="700">Ansible</text>

    <rect x="250" y="48" width="108" height="100" rx="8" fill="#ede7f6" stroke="#5e35b1"/>
    <text x="304" y="72" font-size="16" font-weight="700" fill="#5e35b1">K3</text>
    <text x="304" y="93">nädal 3</text>
    <text x="304" y="115" font-weight="700">Docker</text>
    <text x="304" y="134">+ Trivy</text>

    <rect x="366" y="48" width="108" height="100" rx="8" fill="#ede7f6" stroke="#5e35b1"/>
    <text x="420" y="72" font-size="16" font-weight="700" fill="#5e35b1">K4</text>
    <text x="420" y="93">nädal 4</text>
    <text x="420" y="115" font-weight="700">OpenTofu</text>
    <text x="420" y="134">Proxmox</text>

    <rect x="482" y="48" width="108" height="100" rx="8" fill="#ede7f6" stroke="#5e35b1"/>
    <text x="536" y="72" font-size="16" font-weight="700" fill="#5e35b1">K5</text>
    <text x="536" y="93">nädal 5</text>
    <text x="536" y="115" font-weight="700">GitHub</text>
    <text x="536" y="134" font-weight="700">Actions</text>

    <rect x="598" y="48" width="108" height="100" rx="8" fill="#ede7f6" stroke="#5e35b1"/>
    <text x="652" y="72" font-size="16" font-weight="700" fill="#5e35b1">K6</text>
    <text x="652" y="93">nädal 6</text>
    <text x="652" y="115" font-weight="700">Jenkins</text>
    <text x="652" y="134">Sonar, Nexus</text>

    <rect x="714" y="48" width="108" height="100" rx="8" fill="#ede7f6" stroke="#5e35b1"/>
    <text x="768" y="72" font-size="16" font-weight="700" fill="#5e35b1">K7</text>
    <text x="768" y="93">nädal 7</text>
    <text x="768" y="115" font-weight="700">k3s</text>
    <text x="768" y="134">+ Argo CD</text>
  </g>

  <!-- ühendused päevast läbiva ribani -->
  <g stroke="#7e57c2" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#nool)">
    <line x1="72" y1="148" x2="72" y2="178"/>
    <line x1="188" y1="148" x2="188" y2="178"/>
    <line x1="304" y1="148" x2="304" y2="178"/>
    <line x1="420" y1="148" x2="420" y2="178"/>
    <line x1="536" y1="148" x2="536" y2="178"/>
    <line x1="652" y1="148" x2="652" y2="178"/>
    <line x1="768" y1="148" x2="768" y2="178"/>
  </g>

  <!-- Labori seis läbib kõiki päevi -->
  <path d="M18,182 H806 L830,202 L806,222 H18 Z" fill="#fff3e0" stroke="#ff9100" stroke-width="2" stroke-linejoin="round"/>
  <text x="412" y="207" font-size="15" font-weight="700" fill="#212121" text-anchor="middle">Labori seis: sama rakendus, iga kord ühe kihi võrra automaatsemalt</text>

  <!-- päeva tulemus -->
  <g font-size="14" fill="#212121" text-anchor="middle">
    <text x="72" y="250">5 VM-i</text>
    <text x="72" y="269">skriptiga</text>
    <text x="188" y="250">rollid,</text>
    <text x="188" y="269">changed=0</text>
    <text x="304" y="250">Compose,</text>
    <text x="304" y="269">register</text>
    <text x="420" y="250">5 VM-i</text>
    <text x="420" y="269">koodist</text>
    <text x="536" y="250">build → test</text>
    <text x="536" y="269">→ deploy</text>
    <text x="652" y="250">sama tarne</text>
    <text x="652" y="269">väravaga</text>
    <text x="768" y="250">klastris,</text>
    <text x="768" y="269">lõputest</text>
  </g>
</svg>
