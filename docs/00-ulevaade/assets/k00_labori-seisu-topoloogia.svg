<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="nool" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7e57c2"/>
    </marker>
  </defs>
  <rect width="820" height="430" fill="#ffffff"/>

  <!-- Proxmoxi pool -->
  <rect x="150" y="16" width="652" height="306" rx="8" fill="none" stroke="#7e57c2" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="168" y="42" font-size="14" fill="#5e35b1" font-weight="700">Sinu Proxmoxi pool · 192.168.125.x, IP-d Proxmoxist</text>

  <!-- Brauser -->
  <rect x="20" y="150" width="84" height="60" rx="8" fill="#fff3e0" stroke="#ff9100"/>
  <text x="62" y="185" font-size="15" font-weight="700" fill="#212121" text-anchor="middle">Brauser</text>

  <!-- web01 -->
  <rect x="172" y="132" width="150" height="96" rx="8" fill="#ede7f6" stroke="#5e35b1"/>
  <g font-size="14" fill="#212121" text-anchor="middle">
    <text x="247" y="160" font-size="16" font-weight="700">web01</text>
    <text x="247" y="182">Ubuntu</text>
    <text x="247" y="204">Nginx :80</text>
  </g>

  <!-- app01 -->
  <rect x="368" y="132" width="164" height="96" rx="8" fill="#ede7f6" stroke="#5e35b1"/>
  <g font-size="14" fill="#212121" text-anchor="middle">
    <text x="450" y="156" font-size="16" font-weight="700">app01</text>
    <text x="450" y="177">Ubuntu</text>
    <text x="450" y="198">Tomcat :8080</text>
    <text x="450" y="218" font-weight="700" fill="#5e35b1">Labori seis</text>
  </g>

  <!-- tagaosa -->
  <g font-size="14" fill="#212121" text-anchor="middle">
    <rect x="600" y="58" width="184" height="64" rx="8" fill="#ede7f6" stroke="#5e35b1"/>
    <text x="692" y="84" font-weight="700">mc01 · AlmaLinux</text>
    <text x="692" y="106">Memcached :11211</text>

    <rect x="600" y="148" width="184" height="64" rx="8" fill="#ede7f6" stroke="#5e35b1"/>
    <text x="692" y="174" font-weight="700">rmq01 · Ubuntu</text>
    <text x="692" y="196">RabbitMQ :5672</text>

    <rect x="600" y="238" width="184" height="64" rx="8" fill="#ede7f6" stroke="#5e35b1"/>
    <text x="692" y="264" font-weight="700">db01 · AlmaLinux</text>
    <text x="692" y="286">MariaDB :3306</text>
  </g>

  <!-- päringu tee -->
  <g stroke="#7e57c2" stroke-width="2" fill="none" marker-end="url(#nool)">
    <line x1="104" y1="180" x2="170" y2="180"/>
    <line x1="322" y1="180" x2="366" y2="180"/>
    <path d="M512,132 C522,96 560,90 598,90"/>
    <line x1="532" y1="180" x2="598" y2="180"/>
    <path d="M512,228 C522,264 560,270 598,270"/>
  </g>

  <!-- protokollid -->
  <g font-size="12" fill="#5e35b1" text-anchor="middle">
    <text x="127" y="162">HTTP</text>
    <text x="127" y="174">:80</text>
    <text x="345" y="162">HTTP</text>
    <text x="345" y="174">:8080</text>
    <text x="565" y="162">AMQP</text>
    <text x="565" y="174">:5672</text>
    <text x="508" y="104" text-anchor="end">Memcached :11211</text>
    <text x="508" y="264" text-anchor="end">MariaDB :3306</text>
  </g>

  <!-- control node -->
  <rect x="300" y="364" width="240" height="50" rx="8" fill="#fff3e0" stroke="#ff9100"/>
  <text x="420" y="386" font-size="15" font-weight="700" fill="#212121" text-anchor="middle">control node</text>
  <text x="420" y="405" font-size="14" fill="#212121" text-anchor="middle">control · siin jooksevad käsud</text>
  <line x1="420" y1="364" x2="420" y2="325" stroke="#7e57c2" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#nool)"/>
  <text x="432" y="349" font-size="14" fill="#5e35b1">SSH :22 kõigile viiele (kasutaja «kasutaja»)</text>
</svg>
