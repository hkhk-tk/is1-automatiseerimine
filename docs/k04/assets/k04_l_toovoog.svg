<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 230" width="860" font-family="Inter, Arial, sans-serif" font-size="14" fill="#212121">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5e35b1"/></marker></defs>
<rect width="860" height="230" fill="#ffffff"/>
<g text-anchor="middle">
<rect x="10" y="15" width="150" height="100" rx="8" fill="#f5f5f5" stroke="#757575" stroke-width="1.5"/>
<text x="85" y="44" font-family="monospace" font-weight="bold" font-size="15">tofu fmt</text><text x="85" y="72">joondab koodi</text><text x="85" y="94">ühtsele kujule</text>
<rect x="180" y="15" width="150" height="100" rx="8" fill="#f5f5f5" stroke="#757575" stroke-width="1.5"/>
<text x="255" y="44" font-family="monospace" font-weight="bold" font-size="15">tofu init</text><text x="255" y="72">laadib provider'i,</text><text x="255" y="94">kirjutab lukufaili</text>
<rect x="350" y="15" width="150" height="100" rx="8" fill="#f5f5f5" stroke="#757575" stroke-width="1.5"/>
<text x="425" y="44" font-family="monospace" font-weight="bold" font-size="15">tofu validate</text><text x="425" y="72">kontrollib nimesid,</text><text x="425" y="94">viiteid ja tüüpe</text>
<rect x="520" y="15" width="150" height="100" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
<text x="595" y="44" font-family="monospace" font-weight="bold" font-size="15">tofu plan</text><text x="595" y="72">loeb tegeliku oleku,</text><text x="595" y="94">näitab muudatusi</text>
<rect x="690" y="15" width="160" height="100" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.5"/>
<text x="770" y="44" font-family="monospace" font-weight="bold" font-size="15">tofu apply</text><text x="770" y="72">muudab Proxmoxi,</text><text x="770" y="94">kirjutab state'i</text>
<rect x="10" y="135" width="490" height="34" rx="8" fill="#f5f5f5"/><text x="255" y="157">ainult kood ja control node, Proxmoxi poole ei pöörduta</text>
<rect x="520" y="135" width="330" height="34" rx="8" fill="#e3f2fd"/><text x="685" y="157">Proxmoxi API kaudu</text>
<text x="685" y="200" font-size="13">tofu destroy kustutab kõik, mille kood lõi</text>
<text x="255" y="200" font-size="13">vead leitakse enne, kui midagi muutub</text>
</g>
<g stroke="#5e35b1" stroke-width="2" marker-end="url(#a)">
<line x1="160" y1="65" x2="178" y2="65"/><line x1="330" y1="65" x2="348" y2="65"/><line x1="500" y1="65" x2="518" y2="65"/><line x1="670" y1="65" x2="688" y2="65"/>
